name: test

# Runs the real test suite on every push/PR. Vercel's own build does NOT
# run `npm test` (only `npm run build`), so without this, a change that
# compiles fine but breaks a test would reach production unnoticed.

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.3.0'
      - run: npm ci
      - run: npm test
